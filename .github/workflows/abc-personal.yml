name: ABC Personal CI and stage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: ABC frontend and production bundle
    runs-on: [self-hosted, linux, x64, abc-personal-pr]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/verify-frontend-live-build.mjs
      - name: Reproduce and test the patched production bundle
        run: |
          export AUDIT_BUNDLE_OUT="$RUNNER_TEMP/joker-ads-audit"
          python3 -B deploy/verify-bundled-production.py
          node scripts/test-audit-runtime.mjs
      - run: node scripts/verify-android-bridge.mjs

  admin:
    name: ABC admin and payment isolation
    runs-on: [self-hosted, linux, x64, abc-personal-pr]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm ci --prefix admin --no-audit --no-fund
      - run: node scripts/test-audit-security.mjs
      - run: node scripts/test-ad-sync.mjs
      - run: node scripts/test-audit-config.mjs
      - run: node scripts/test-live-routes.mjs
      - run: node scripts/test-live-migration.mjs

  android:
    name: ABC Android package
    runs-on: [self-hosted, linux, x64, abc-personal-pr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - run: gradle -p android --no-daemon assembleRelease assembleDebug testDebugUnitTest lintRelease
      - run: |
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s android/app/build/outputs/apk/debug/app-debug.apk

  required:
    name: ABC required
    runs-on: [self-hosted, linux, x64, abc-personal-pr]
    needs: [frontend, admin, android]
    if: ${{ always() }}
    timeout-minutes: 4
    steps:
      - name: Require all three final results
        env:
          FRONTEND: ${{ needs.frontend.result }}
          ADMIN: ${{ needs.admin.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          printf 'frontend=%s admin=%s android=%s\n' "$FRONTEND" "$ADMIN" "$ANDROID"
          test "$FRONTEND" = success && test "$ADMIN" = success && test "$ANDROID" = success

  stage:
    name: ABC stage-only handoff
    runs-on: [self-hosted, linux, x64, abc-personal-release]
    needs: required
    if: >-
      ${{ needs.required.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'joker0908-bot/joker-ads' &&
          github.repository_id == '1327907600' &&
          github.workflow_ref == 'joker0908-bot/joker-ads/.github/workflows/abc-personal.yml@refs/heads/main' &&
          github.ref == 'refs/heads/main' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify the candidate from the checked-out SHA
        run: |
          export AUDIT_BUNDLE_OUT="$RUNNER_TEMP/joker-ads-stage-audit"
          python3 -B deploy/verify-bundled-production.py
          python3 -B scripts/package-abc-stage.py --sha "$GITHUB_SHA" --bundle "$AUDIT_BUNDLE_OUT" --output "$RUNNER_TEMP/joker-ads-stage"
      - name: Publish stage-only candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: joker-ads-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/joker-ads-stage/*
          if-no-files-found: error
