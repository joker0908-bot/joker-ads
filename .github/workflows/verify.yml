name: Verify server deployment and APK
on:
  pull_request:
  push:
    branches: [main, fix/server-nav-four-tabs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: SBQB Required Gate
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Live frontend features and brand check
        run: node scripts/verify-frontend-live-build.mjs
      - name: Reproduce and check the actual VPS build
        run: python3 deploy/verify-bundled-production.py
      - run: node scripts/verify-android-bridge.mjs
      - name: Admin deploy-time regressions and live-route smoke tests
        run: |
          npm ci --prefix admin --no-audit --no-fund
          node scripts/test-audit-security.mjs
          node scripts/test-ad-sync.mjs
          node scripts/test-audit-config.mjs
          node scripts/test-live-routes.mjs
          node scripts/test-live-migration.mjs
  android:
    name: Android package
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platforms;android-35 build-tools;35.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build and verify Android package
        run: gradle -p android --no-daemon assembleRelease assembleDebug testDebugUnitTest lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: boluo-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: boluo-debug-acceptance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
