name: Verify server deployment and APK
on:
  pull_request:
  push:
    branches: [main, fix/server-nav-four-tabs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: SBQB Required Gate
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Reproduce and check the actual VPS build
        run: python3 deploy/verify-bundled-production.py
      - run: node scripts/verify-android-bridge.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o "${RUNNER_TEMP}/commandlinetools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "${RUNNER_TEMP}/commandlinetools.zip" -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK_ROOT/licenses/android-sdk-license"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build and verify Android package
        run: gradle -p android --no-daemon assembleRelease assembleDebug testDebugUnitTest lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: boluo-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: boluo-debug-acceptance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
