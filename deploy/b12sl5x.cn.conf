server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name b12sl5x.cn www.b12sl5x.cn;
    index index.html;
    root /www/wwwroot/b12sl5x.cn;

    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    ssl_certificate    /etc/letsencrypt/live/b12sl5x.cn/fullchain.pem;
    ssl_certificate_key    /etc/letsencrypt/live/b12sl5x.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    # 证书申请验证目录（certbot HTTP-01）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/b12sl5x.cn;
        allow all;
    }

    # 运行时 JSON（后台发布，无需 rebuild）
    location ^~ /data/ {
        # Atomic publishing creates private (0600) files. Let the admin BFF
        # read them; Nginx workers cannot read root-owned files directly.
        if ($uri !~ "^/data/(config|popups|tabs|meta|site-bundle)\.json$") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /uploads/ {
        alias /opt/ads-king/uploads/;
        expires 30d;
        access_log off;
    }

    location /api/public/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /boluo-api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧 App/聚合上游兼容：/dewu-api/ 内部转发到 /boluo-api/
    location ^~ /dewu-api/ {
        rewrite ^/dewu-api/(.*)$ /boluo-api/$1 break;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 接口/媒体/支付代理，与 al-ads.com 共用同一份配置
    include /www/server/panel/vhost/nginx/extension/seduoduo.cc/ads-king-proxy.conf;

    # 安卓包：短链 /boluu（发给渠道）和 /boluo.apk
    location = /boluu {
        alias /www/wwwroot/b12sl5x.cn/boluo.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="boluo.apk"';
        add_header Cache-Control "no-cache";
    }

    location = /boluo.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="boluo.apk"';
        add_header Cache-Control "no-cache";
    }

    # 旧链接 301 到新签名包（2026-11-17 菠萝包就位，旧包已备份）
    location = /dewuu {
        return 301 /boluo.apk;
    }

    location = /dewu.apk {
        return 301 /boluo.apk;
    }

    # 构建产物文件名带 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|geb|ceb)$ {
        expires 30d;
        access_log off;
    }

    # index.html 绝不能缓存，否则用户会拿着旧的文件名去请求已删除的 assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 单页应用：未知路径一律回 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_vary on;

    access_log /www/wwwlogs/b12sl5x.cn.log api_redacted;
    error_log   /www/wwwlogs/b12sl5x.cn.error.log;
}
